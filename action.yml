name: "Grok Build PR Review"
description: >-
    AI pull request reviews powered by your Grok Build (SuperGrok) subscription.
author: "0xr3ngar"
branding:
    icon: "eye"
    color: "gray-dark"

inputs:
    grok_auth_json:
        description: >-
            Contents of ~/.grok/auth.json from a machine where you ran `grok login`.
            Keep the existing organization secret GROK_AUTH_JSON and its visibility unchanged.
        required: true
    github_token:
        description: "Token used to read the PR and post comments/reviews."
        required: false
        default: ${{ github.token }}
    reviewer_login:
        description: "Expected GitHub App bot login, e.g. szymboot[bot]. Installation token required."
        required: true
    expected_sha:
        description: "Exact event head SHA; stale events fail without publishing."
        required: true
    pr_number:
        description: "PR number to review. Defaults to the PR that triggered the workflow."
        required: false
        default: ""
    model:
        description: "Model to use (e.g. grok-build). Empty = CLI default."
        required: false
        default: "grok-4.6"
    effort:
        description: "Effort level: low | medium | high | xhigh | max. Empty = CLI default."
        required: false
        default: "medium"
    max_turns:
        description: "Maximum agentic turns for the headless grok run."
        required: false
        default: "50"
    fail_on:
        description: "When to fail the check: never | bugs | any."
        required: false
        default: "never"
    roast_level:
        description: >-
            Compatibility input. Lifecycle reviews are always professional.
        required: false
        default: "professional"
    custom_instructions:
        description: >-
            Extra review instructions injected into the prompt (conventions, focus areas,
            things to ignore). Repository guidance is treated as untrusted review criteria.
        required: false
        default: ""
    status_comments:
        description: "Compatibility input. Lifecycle status is always posted for visibility."
        required: false
        default: "true"
    max_diff_kb:
        description: "Maximum diff size (KB); larger diffs fail closed without truncation."
        required: false
        default: "300"

outputs:
    review_event:
        description: "APPROVE | REQUEST_CHANGES | COMMENT; empty on failure"
        value: ${{ steps.finish.outputs.review_event }}
    verdict:
        description: "Review verdict: clean | issues | error"
        value: ${{ steps.finish.outputs.verdict }}
    issue_count:
        description: "Total number of issues found."
        value: ${{ steps.finish.outputs.issue_count }}
    bug_count:
        description: "Number of bug-severity issues found."
        value: ${{ steps.finish.outputs.bug_count }}
    review_url:
        description: "URL of the posted GitHub review, including approvals."
        value: ${{ steps.finish.outputs.review_url }}

runs:
    using: "composite"
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2

        - name: Install trusted action dependencies
          shell: bash
          working-directory: ${{ github.action_path }}
          run: bun install --frozen-lockfile --production --ignore-scripts

        - name: Prepare isolated review
          id: ctx
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.github_token }}
              PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
              REVIEWER_LOGIN: ${{ inputs.reviewer_login }}
              EXPECTED_SHA: ${{ inputs.expected_sha }}
              MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
          run: |
              set -euo pipefail
              WORK="$(mktemp -d "$RUNNER_TEMP/grok-review.XXXXXX")"
              export WORK
              echo "work=$WORK" >> "$GITHUB_OUTPUT"
              bun "$GITHUB_ACTION_PATH/scripts/lifecycle/main.ts" collect
              python3 "$GITHUB_ACTION_PATH/scripts/lifecycle/export-source.py" "$WORK/source"
              docker build -t "grok-review:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_ACTION_PATH/scripts/lifecycle"

        - name: Run isolated Grok review
          shell: bash
          env:
              WORK: ${{ steps.ctx.outputs.work }}
              GROK_AUTH_JSON: ${{ inputs.grok_auth_json }}
              MODEL: ${{ inputs.model }}
              EFFORT: ${{ inputs.effort }}
              MAX_TURNS: ${{ inputs.max_turns }}
              CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
          run: |
              set -euo pipefail
              test "$MODEL" = "grok-4.6"
              test "$EFFORT" = "medium"
              bun "$GITHUB_ACTION_PATH/scripts/lifecycle/main.ts" prompt
              mkdir -m 700 "$WORK/auth"
              printf '%s' "$GROK_AUTH_JSON" > "$WORK/auth/auth.json"
              chmod 600 "$WORK/auth/auth.json"
              jq -e 'type == "object"' "$WORK/auth/auth.json" >/dev/null
              unset GROK_AUTH_JSON CUSTOM_INSTRUCTIONS
              set +e
              # Only source, prompt and the subscription session enter the container.
              # No runner files, .git, GitHub token, App key, API key or host environment.
              docker run --rm --cap-drop ALL --security-opt no-new-privileges \
                --mount "type=bind,src=$WORK/source,dst=/workspace,readonly" \
                --mount "type=bind,src=$WORK/prompt.md,dst=/review/prompt.md,readonly" \
                --mount "type=bind,src=$WORK/auth,dst=/root/.grok" \
                "grok-review:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                --prompt-file /review/prompt.md --output-format json \
                --yolo --no-subagents --disable-web-search \
                --tools "read_file,grep,list_dir" --max-turns "$MAX_TURNS" \
                --no-auto-update --cwd /review -m "$MODEL" --effort "$EFFORT" \
                > "$WORK/grok-output.json" 2> "$WORK/grok-stderr.log"
              echo "$?" > "$WORK/grok-exit"
              set -e

        - name: Publish verified App review
          id: finish
          if: ${{ always() && steps.ctx.outputs.work != '' }}
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.github_token }}
              PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
              REVIEWER_LOGIN: ${{ inputs.reviewer_login }}
              WORK: ${{ steps.ctx.outputs.work }}
              FAIL_ON: ${{ inputs.fail_on }}
          run: bun "$GITHUB_ACTION_PATH/scripts/lifecycle/main.ts" finish

        - name: Cleanup review session
          if: ${{ always() }}
          shell: bash
          env:
              WORK: ${{ steps.ctx.outputs.work }}
          run: |
              if [[ "$WORK" == "$RUNNER_TEMP"/grok-review.* ]]; then
                sudo rm -rf -- "$WORK"
              fi
